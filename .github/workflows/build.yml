name: build-gawk-windows-x64

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 💡 填入你想編譯的 GNU 官方版本號（例如 5.4.1）
  GAWK_VERSION: "5.4.1" 

jobs:
  # =================================================================
  # Windows x86_64 平台編譯 Job
  # =================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout wrapper scripts
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            git autoconf automake libtool make base-devel bison gettext gettext-devel xz zip
            mingw-w64-x86_64-toolchain

      # 💡 透過 env 區塊傳遞變數，防止 msys2 大括號語法衝突
      - name: Download and Extract GNU Awk source
        shell: msys2 {0}
        env:
          G_VER: ${{ env.GAWK_VERSION }}
        run: |
          mkdir -p upstream
          echo "正在從 GNU FTP 下載 gawk-${G_VER}.tar.gz..."
          curl -sSL "https://gnu.org{G_VER}.tar.gz" -o gawk-src.tar.gz
          
          echo "正在解壓縮原始碼..."
          tar -xzf gawk-src.tar.gz
          
          # 將解壓出來的資料夾重命名為 scripts/build.sh 所預期的 upstream/gawk
          mv "gawk-${G_VER}" upstream/gawk
          rm gawk-src.tar.gz
          
          echo "原始碼準備完畢！"
          ls -la upstream/gawk

      - name: Run Build Script
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
          TARGET: "x86_64-windows"
          GAWK_TARGET_ARCH: "x86_64"
          GAWK_OS_HINT: windows
          CC: gcc
          HOST: gcc
          JOBS: "4"
          CFLAGS: "-O2"
          LDFLAGS: ""
          CONFIGURE_ARGS: "--disable-dependency-tracking --enable-shared --disable-extensions --with-readline --with-mpfr --enable-pma --disable-silent-rules"
        run: bash scripts/build.sh

      - name: Run Smoke Tests
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: bash scripts/smoke.sh

      - name: Package Artifacts
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
          TARGET: "x86_64-windows"
        run: bash scripts/package.sh

      - name: Upload Temporary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gawk-artifacts-x86_64-windows
          path: dist/*
          retention-days: 1

  # =================================================================
  # 彙整並推送到 GitHub Release
  # =================================================================
  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gawk-artifacts-*
          merge-multiple: true
          path: dist

      - name: Generate top-level SHA256SUMS
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS 2>/dev/null || true
          echo "=== Final Release Files ==="
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
